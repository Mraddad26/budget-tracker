<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#0D1412;
  --card:#15201C;
  --card2:#1B2A25;
  --line:#24352F;
  --ink:#EAF3EE;
  --ink-soft:#8CA197;
  --mint:#46E0A0;
  --mint-soft:rgba(70,224,160,.12);
  --amber:#F4B94B;
  --amber-soft:rgba(244,185,75,.12);
  --red:#F2715E;
  --red-soft:rgba(242,113,94,.13);
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{color-scheme:dark;}
body{
  margin:0; min-height:100vh;
  background:radial-gradient(900px 420px at 50% -140px, rgba(70,224,160,.14), transparent 70%), var(--bg);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  color:var(--ink);
  padding:22px 16px 130px;
}
.wrap{ max-width:480px; margin:0 auto; }
.masthead{ text-align:center; margin-bottom:18px; }
.masthead h1{ font-size:22px; font-weight:700; margin:0 0 5px; letter-spacing:-.2px; }
.masthead p{ margin:0; font-size:13px; color:var(--ink-soft); }
.masthead .ver{ margin-top:5px; font-size:10.5px; color:#3A5046; }

.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
.card h2{ font-size:13.5px; font-weight:600; margin:0 0 12px; color:var(--ink-soft); }
.card h2 small{ font-weight:400; font-size:11.5px; }

.banner{ font-size:13px; padding:10px 12px; border-radius:14px; margin-bottom:14px; text-align:center; }
.banner.good{ background:var(--mint-soft); border:1px solid rgba(70,224,160,.3); color:var(--mint); }
.banner.bad{ background:var(--red-soft); border:1px solid rgba(242,113,94,.35); color:var(--red); }
.banner.info{ background:var(--amber-soft); border:1px solid rgba(244,185,75,.35); color:var(--amber); }

.seg{ display:flex; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:3px; gap:3px; margin-bottom:12px; }
.seg button{ flex:1; padding:9px 0; border:none; background:transparent; font-family:inherit; font-size:13.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; border-radius:11px; }
.seg button.active{ background:var(--mint); color:#06281B; font-weight:600; }

.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; }
input[type=number], input[type=text], input[type=date], input[type=password], input[type=email]{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:13px; background:var(--card2);
  font-family:'IBM Plex Mono', monospace; font-size:15px; direction:ltr; text-align:right; color:var(--ink); outline:none;
}
input:focus{ border-color:var(--mint); }
input[type=text]{ font-family:'IBM Plex Sans Arabic', sans-serif; direction:rtl; text-align:right; }
::placeholder{ color:#51665D; }

button.primary{ width:100%; padding:13px 0; border:none; border-radius:15px; background:var(--mint); color:#06281B; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; }
button.primary:active{ filter:brightness(.92); }
button.secondary{ width:100%; padding:12px 0; border:1px solid var(--line); border-radius:15px; background:transparent; color:var(--ink); font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; margin-top:8px; }

/* hero ring */
.hero-card{ text-align:center; padding:22px 18px 18px; }
.ring{ position:relative; width:236px; height:236px; margin:0 auto; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring circle{ fill:none; stroke-width:15; }
.ring .trk{ stroke:var(--card2); }
.ring .arc{ stroke-linecap:round; transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1); }
.ring.mint .arc{ stroke:var(--mint); filter:drop-shadow(0 0 8px rgba(70,224,160,.45)); }
.ring.amber .arc{ stroke:var(--amber); filter:drop-shadow(0 0 8px rgba(244,185,75,.4)); }
.ring.red .arc{ stroke:var(--red); filter:drop-shadow(0 0 8px rgba(242,113,94,.4)); }
.ring-c{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-c .rl{ font-size:12.5px; color:var(--ink-soft); margin-bottom:2px; }
.ring-c .rv{ font-family:'IBM Plex Mono', monospace; font-size:46px; font-weight:600; direction:ltr; line-height:1.1; }
.ring.red .rv{ color:var(--red); }
.ring-c .ru{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
.ring-s{ margin-top:14px; font-size:14px; font-weight:500; }
.ring-f{ margin-top:5px; font-size:12px; color:var(--ink-soft); }
.ring-f b{ color:var(--ink); font-family:'IBM Plex Mono', monospace; font-weight:600; }
.hero-sum .k{ font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; }
.hero-sum .big{ font-family:'IBM Plex Mono', monospace; font-size:38px; font-weight:600; direction:ltr; margin-bottom:14px; }
.hero-sum .unit{ font-size:15px; color:var(--ink-soft); margin-inline-start:6px; }

/* stat cards */
.mini-grid{ display:grid; gap:10px; margin-bottom:14px; }
.mini{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:13px 12px; }
.mini .k{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; }
.mini .v{ font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; direction:ltr; text-align:right; }
.mini .v.neg, .stat .v.neg{ color:var(--red); }
.mini .v.pos{ color:var(--mint); }
.mini .h{ font-size:10.5px; color:#617a6f; margin-top:4px; }

.pace{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:14px; }
.pace .row{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; }
.bar{ height:7px; border-radius:5px; background:var(--card2); overflow:hidden; }
.pace .bar{ margin-bottom:10px; }
.pace .bar:last-child{ margin-bottom:0; }
.bar > div{ height:100%; border-radius:5px; background:var(--mint); transition:width .6s ease; }
.bar.time > div{ background:#5C7A6D; }
.bar.over > div, .bar > div.over{ background:var(--red); }

.sect{ font-size:13px; font-weight:600; color:var(--ink-soft); margin:20px 4px 10px; display:flex; justify-content:space-between; align-items:center; }
.sect button{ background:none; border:none; color:var(--mint); font-family:inherit; font-size:12.5px; cursor:pointer; padding:0; }

/* feed */
.feed{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:4px 14px; }
.row{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
.row:last-child{ border-bottom:none; }
.row .rt{ flex:1; min-width:0; }
.row .rn{ font-size:14.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .rd{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.row .ra{ font-family:'IBM Plex Mono', monospace; font-weight:600; direction:ltr; font-size:15px; }
.row .del{ background:none; border:none; color:#5d7469; font-size:15px; cursor:pointer; padding:4px 6px; }
.row.old{ opacity:.45; }
.empty{ color:var(--ink-soft); font-size:13.5px; text-align:center; padding:18px 0; }

/* week cards */
.weeks-scroll{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; margin:0 -16px; padding-inline:16px; scrollbar-width:none; }
.weeks-scroll::-webkit-scrollbar{ display:none; }
.wk{ flex:0 0 138px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; }
.wk.cur{ border-color:var(--mint); background:linear-gradient(180deg, var(--mint-soft), var(--card)); }
.wk.pend{ opacity:.6; }
.wk .wd{ font-size:11.5px; color:var(--ink-soft); }
.wk .wb{ font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; margin:5px 0 8px; direction:ltr; text-align:right; }
.wk .ws{ font-size:11px; color:var(--ink-soft); margin-top:6px; }

/* obligations */
.card-h{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.card-h h2{ margin:0 0 10px; }
.inl{ margin:0 !important; width:auto !important; font-size:12.5px !important; color:var(--mint) !important; text-decoration:none !important; }
.bill-top{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px; }
.bill-top .k{ font-size:11.5px; color:var(--ink-soft); }
.bill-top .v{ font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:600; direction:ltr; }
.bill-top .v.neg{ color:var(--red); }
.bill-top .k2{ font-size:11.5px; color:var(--ink-soft); }

.linklike{ display:block; text-align:center; margin-top:6px; font-size:12.5px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit; }
.foot{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:22px; }
.foot button{ background:var(--card); border:1px solid var(--line); color:var(--ink-soft); font-family:inherit; font-size:12.5px; padding:8px 13px; border-radius:20px; cursor:pointer; }

canvas{ width:100%; height:140px; display:block; }
.legend{ display:flex; gap:14px; justify-content:center; font-size:11.5px; color:var(--ink-soft); margin-top:8px; flex-wrap:wrap; }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

.stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
.stat{ border-top:1px solid var(--line); padding-top:8px; }
.stat .k{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; }
.stat .v{ font-family:'IBM Plex Mono', monospace; font-size:16px; font-weight:600; direction:ltr; text-align:right; }

/* FAB + sheet */
.fab{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); width:64px; height:64px; border-radius:50%; border:none; background:var(--mint); color:#06281B; font-size:34px; font-weight:500; line-height:1; cursor:pointer; box-shadow:0 8px 28px rgba(70,224,160,.4), 0 2px 8px rgba(0,0,0,.5); z-index:20; }
.fab:active{ transform:translateX(-50%) scale(.94); }
.sheet-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; animation:fade .2s ease; }
.sheet{ position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-bottom:none; border-radius:26px 26px 0 0; padding:10px 18px 26px; z-index:40; max-height:88vh; overflow-y:auto; animation:rise .25s cubic-bezier(.2,.8,.2,1); }
.sheet .grab{ width:42px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px; }
.sheet .amt-in{ font-size:34px !important; text-align:center !important; padding:14px !important; border-radius:18px !important; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 12px; }
.chips button{ background:var(--card2); border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:13.5px; padding:7px 14px; border-radius:18px; cursor:pointer; }
.chips button:active{ background:var(--mint-soft); border-color:var(--mint); }
.sheet .hint{ font-size:12px; color:var(--ink-soft); margin:0 0 12px; line-height:1.6; }
@keyframes rise{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

.loading{ text-align:center; color:var(--ink-soft); padding:40px 0; font-size:14px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">جاري التحميل...</div></div>

<script>
const STORAGE_KEY = 'budget-state-v2';
const APP_VERSION = 'v4.1 — 2026/10/31';
const SUPABASE_URL = 'https://cjczauxbziygxjmhptag.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oi_tSJ30GHNTJaUJxEUQkA_dEt1MEf2';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let authMode = 'signin'; // signin | signup
let state = null;
let ui = { mode: 'dashboard' }; // dashboard | newPeriod | editBudget
let showDayTotalForm = false;
let showWeeks = false;
let showAddExpense = false;
let showExpenseList = false;
let showOtherAdd = false;
let showOtherList = false;
let sheetOpen = false;
let sheetTab = 'spend';
let animate = true;

// بياناتك مخزنة على حسابك بقاعدة بيانات Supabase، محمية بحيث ولا حدا غيرك يوصلها.

function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dateFromStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function toStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function firstOfMonthStr(dateStr){ const d=dateFromStr(dateStr); return toStr(new Date(d.getFullYear(), d.getMonth(), 1)); }
function daysInMonthOf(year, month){ return new Date(year, month+1, 0).getDate(); }
function monthlyPeriodStartContaining(dateStr, salaryDay){
  const d = dateFromStr(dateStr);
  let year=d.getFullYear(), month=d.getMonth();
  let day = Math.min(salaryDay, daysInMonthOf(year,month));
  let candidate = new Date(year,month,day);
  if(candidate > d){
    month -= 1; if(month<0){ month=11; year-=1; }
    day = Math.min(salaryDay, daysInMonthOf(year,month));
    candidate = new Date(year,month,day);
  }
  return toStr(candidate);
}
function nextSalaryDateAfter(periodStartStr, salaryDay){
  const d = dateFromStr(periodStartStr);
  let year=d.getFullYear(), month=d.getMonth()+1;
  if(month>11){ month=0; year+=1; }
  const day = Math.min(salaryDay, daysInMonthOf(year,month));
  return toStr(new Date(year,month,day));
}
function daysBetweenInclusive(a,b){ return Math.round((dateFromStr(b)-dateFromStr(a))/86400000)+1; }
function fmt(n){ return (Math.round((n||0)*100)/100).toFixed(2); }

function getPeriodEnd(startStr, type, salaryDay){
  if(type==='weekly'){
    const start = dateFromStr(startStr);
    const end = new Date(start);
    end.setDate(end.getDate()+6);
    return toStr(end);
  }
  const next = nextSalaryDateAfter(startStr, salaryDay||1);
  return toStr(new Date(dateFromStr(next).getTime() - 86400000));
}
function periodEndOf(st){ return st.periodEnd || getPeriodEnd(st.periodStart, st.periodType, st.salaryDay); }
function buildWeeks(startStr, endStr){
  // أسابيع مربوطة بيوم ثابت: كل أسبوع يبلش السبت وينتهي الجمعة (متل ما يلي بالميزانية).
  // أول قطعة بالفترة ممكن تكون أقصر من 7 أيام لو الفترة ما بلشت يوم سبت بالظبط.
  let weeks=[]; let cur=dateFromStr(startStr); const end=dateFromStr(endStr);
  while(cur<=end){
    let ws=new Date(cur);
    const daysUntilSat = (6 - cur.getDay() + 7) % 7; // 0 لو cur نفسه سبت
    let we=new Date(cur); we.setDate(we.getDate() + (daysUntilSat===0 ? 6 : daysUntilSat-1));
    if(we>end) we=new Date(end);
    weeks.push({start:toStr(ws), end:toStr(we)});
    cur = new Date(we); cur.setDate(cur.getDate()+1);
  }
  return weeks;
}
function esc(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dateLabel(dateStr){
  const today = todayStr();
  const yest = toStr(new Date(dateFromStr(today).getTime() - 86400000));
  if(dateStr === today) return 'اليوم';
  if(dateStr === yest) return 'أمس';
  return dateStr;
}
function sumExpensesBetween(expenses, start, end){
  return expenses.filter(e=>e.date>=start && e.date<=end).reduce((s,e)=>s+e.amount,0);
}
function sumExpensesBefore(expenses, date){
  return expenses.filter(e=>e.date<date).reduce((s,e)=>s+e.amount,0);
}

async function loadState(){
  try{
    const { data, error } = await sb.from('budget_state').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    state = (data && data.data && Object.keys(data.data).length) ? data.data : null;
    if(state && state.savings === undefined) state.savings = 0;
    if(state && !state.history) state.history = [];
    if(state && !state.trackingStart) state.trackingStart = state.periodStart;
    if(state && !state.salaryDay) state.salaryDay = 1;
    if(state && state.generalBudgetAmount === undefined) state.generalBudgetAmount = 0;
    if(state && !state.otherExpenses) state.otherExpenses = [];
    if(state && state.periodType==='monthly' && state.salaryDay!==1){
      state.salaryDay = 1;
      state.periodStart = monthlyPeriodStartContaining(todayStr(), 1);
      state.trackingStart = todayStr();
      saveState();
    }
  }catch(e){ console.error('تعذر تحميل البيانات', e); state = null; }
  render();
}
async function saveState(){
  try{
    const { error } = await sb.from('budget_state').upsert({ user_id: currentUser.id, data: state, updated_at: new Date().toISOString() });
    if(error) throw error;
  }catch(e){ console.error('تعذر الحفظ', e); alert('تعذر الحفظ — تأكد من الاتصال بالإنترنت'); }
}

function exportBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'budget-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.periodType || !parsed.expenses){ alert('ملف غير صالح'); return; }
      state = parsed;
      if(state.savings === undefined) state.savings = 0;
      if(!state.history) state.history = [];
      if(state.generalBudgetAmount === undefined) state.generalBudgetAmount = 0;
      if(!state.otherExpenses) state.otherExpenses = [];
      saveState(); render();
      alert('تم استرجاع النسخة الاحتياطية بنجاح');
    }catch(err){ alert('ما قدرت أقرأ الملف'); }
  };
  reader.readAsText(file);
}

function setupBudget(type, amount, salaryDay, generalAmount, startDate, endDate){
  const sDay = salaryDay || 1;
  const sd = startDate || todayStr();
  const start = type==='monthly' ? monthlyPeriodStartContaining(sd, sDay) : sd;
  state = { periodType:type, budgetAmount:amount, periodStart:start, salaryDay:sDay, trackingStart:sd, expenses:[], savings:0, history:[], generalBudgetAmount:(generalAmount||0), otherExpenses:[], periodEnd:null };
  if(endDate && endDate !== getPeriodEnd(start, type, sDay)) state.periodEnd = endDate;
  saveState(); render();
}
function addExpense(amount, note, date){
  state.expenses.push({ id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), date:(date||todayStr()), amount, note:note||'' });
  state.expenses.sort((a,b)=> a.date.localeCompare(b.date) || (a.id.localeCompare(b.id)));
  saveState(); render();
}
function addOtherExpense(amount, note, date){
  state.otherExpenses.push({ id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), date:(date||todayStr()), amount, note:note||'' });
  state.otherExpenses.sort((a,b)=> a.date.localeCompare(b.date) || (a.id.localeCompare(b.id)));
  saveState(); render();
}
function deleteOtherExpense(id){
  state.otherExpenses = state.otherExpenses.filter(e=>e.id!==id);
  saveState(); render();
}
function logDayTotal(date, total){
  const already = sumExpensesBetween(state.expenses, date, date);
  const diff = total - already;
  if(Math.abs(diff) < 0.005){
    alert('مجموع ' + dateLabel(date) + ' مطابق أصلاً (' + fmt(already) + ' د.أ) — ما في داعي لأي تعديل');
    return;
  }
  addExpense(diff, 'تسوية لمطابقة مجموع اليوم', date);
  alert('تمام، ضفت تسوية قدرها ' + fmt(diff) + ' د.أ، فصار مجموع ' + dateLabel(date) + ' = ' + fmt(total) + ' د.أ');
}
function deleteExpense(id){
  state.expenses = state.expenses.filter(e=>e.id!==id);
  saveState(); render();
}

function computeCurrentPeriodInfo(){
  const today = todayStr();
  const periodEnd = periodEndOf(state);
  const allocStart = state.trackingStart || state.periodStart; // من هون بتبلش الحصص الفعلية
  const daysInPeriod = daysBetweenInclusive(allocStart, periodEnd);
  const notStarted = today < allocStart;
  const refDay = notStarted ? allocStart : today;
  let daysRemainingPeriod = daysBetweenInclusive(refDay, periodEnd);
  const periodOver = daysRemainingPeriod <= 0;
  if(daysRemainingPeriod < 0) daysRemainingPeriod = 0;
  const totalSpent = state.expenses.filter(e=>e.date>=allocStart).reduce((s,e)=>s+e.amount,0);
  const remainingBudget = state.budgetAmount - totalSpent;
  const spentToday = notStarted ? 0 : sumExpensesBetween(state.expenses, today, today);

  // الحصة اليومية ثابتة: الميزانية ÷ عدد أيام الفترة (من أول تتبع لآخر الفترة)
  const dailyFixed = state.budgetAmount / Math.max(daysInPeriod,1);

  // الرصيد المدور: فرق الأيام اللي خلصت (قبل اليوم) بين الحصة الثابتة والصرف الفعلي
  const daysDone = Math.min(daysInPeriod, Math.max(0, daysBetweenInclusive(allocStart, today) - 1));
  const spentBefore = state.expenses.filter(e=>e.date>=allocStart && e.date<today).reduce((s,e)=>s+e.amount,0);
  const rolledBalance = dailyFixed * daysDone - spentBefore;

  // الحصة المعدّلة: كل يوم بالصبح = (الميزانية - اللي انصرف قبل اليوم) ÷ الأيام الباقية بما فيها اليوم
  const dailyAdj = periodOver ? 0 : (notStarted ? dailyFixed : (state.budgetAmount - spentBefore) / Math.max(daysRemainingPeriod,1));
  // سجل الحصة اليومية: كيف تغيرت الحصة من يوم لآخر
  const allowSeries = [];
  if(!notStarted){
    for(let d=allocStart, guard=0; d<=today && d<=periodEnd && guard<400; guard++){
      const sb4 = state.expenses.filter(e=>e.date>=allocStart && e.date<d).reduce((a,e)=>a+e.amount,0);
      const rem = daysBetweenInclusive(d, periodEnd);
      allowSeries.push({date:d, v:(state.budgetAmount-sb4)/Math.max(rem,1)});
      d = toStr(new Date(dateFromStr(d).getTime()+86400000));
    }
  }

  let weeksTable=[], currentWeekIndex=-1, weeklyBudget=null, weeklyRemaining=null;

  if(state.periodType==='monthly'){
    const weeks = buildWeeks(allocStart, periodEnd);
    currentWeekIndex = weeks.findIndex(w => today>=w.start && today<=w.end);
    if(currentWeekIndex===-1) currentWeekIndex = periodOver ? weeks.length-1 : 0;
    weeks.forEach((w,i)=>{
      const len = daysBetweenInclusive(w.start, w.end);
      const wBudget = (i>currentWeekIndex ? dailyAdj : dailyFixed) * len;
      if(i>currentWeekIndex){ weeksTable.push({...w, budget:wBudget, spent:null, diff:null, pending:true}); return; }
      const wSpent = sumExpensesBetween(state.expenses, w.start, w.end);
      weeksTable.push({...w, budget:wBudget, spent:wSpent, diff:wBudget-wSpent, pending:false});
      if(i===currentWeekIndex){
        const left = notStarted ? len : daysBetweenInclusive(today, w.end);
        weeklyRemaining = dailyAdj * left - spentToday;
        weeklyBudget = wSpent + weeklyRemaining;
        weeksTable[weeksTable.length-1].budget = weeklyBudget;
        weeksTable[weeksTable.length-1].diff = weeklyRemaining;
      }
    });
  }

  const elapsedDays = notStarted ? 0 : (daysInPeriod - daysRemainingPeriod + (periodOver?0:1));
  const pctTime = Math.min(100, Math.max(0, (elapsedDays/daysInPeriod)*100));
  const pctSpent = state.budgetAmount>0 ? (totalSpent/state.budgetAmount)*100 : 0;

  return { today, allocStart, notStarted, periodEnd, daysInPeriod, daysRemainingPeriod, periodOver, totalSpent, remainingBudget,
           spentToday, weeksTable, currentWeekIndex, dailyFixed, dailyAdj, allowSeries, rolledBalance, weeklyBudget, weeklyRemaining,
           pctTime, pctSpent };
}

function startNewPeriodFlow(){ ui = { mode:'newPeriod' }; render(); }
function cancelFlow(){ ui = { mode:'dashboard' }; render(); }

function confirmNewPeriod(newAmount, repayAmount, newGeneralAmount, startDate, endDate){
  const sd = startDate || todayStr();
  const info = computeCurrentPeriodInfo();
  const diff = state.budgetAmount - info.totalSpent;
  state.history.push({ type:state.periodType, amount:state.budgetAmount, start:state.periodStart, end:info.periodEnd, spent:info.totalSpent, diff });
  state.savings += diff;
  if(repayAmount && repayAmount>0){
    state.savings += repayAmount;
    newAmount = newAmount - repayAmount;
  }
  state.periodStart = state.periodType==='monthly' ? monthlyPeriodStartContaining(sd, state.salaryDay||1) : sd;
  state.trackingStart = sd;
  state.periodEnd = null;
  if(endDate && endDate !== getPeriodEnd(state.periodStart, state.periodType, state.salaryDay||1)) state.periodEnd = endDate;
  state.expenses = [];
  state.otherExpenses = [];
  state.budgetAmount = newAmount;
  state.generalBudgetAmount = newGeneralAmount!==undefined ? newGeneralAmount : (state.generalBudgetAmount||0);
  ui = { mode:'dashboard' };
  saveState(); render();
}

function drawHistoryChart(canvas, history){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const items = history.slice(-6);
  if(items.length===0) return;
  const max = Math.max(...items.map(i=>Math.max(i.amount,i.spent)), 1);
  const padL=6, padR=6, padB=18, padT=6;
  const groupW = (w - padL - padR) / items.length;
  const barW = Math.min(18, groupW/3);
  items.forEach((it, idx)=>{
    const gx = padL + idx*groupW + groupW/2;
    const budgetH = (it.amount/max) * (h-padB-padT);
    const spentH = (it.spent/max) * (h-padB-padT);
    ctx.fillStyle = '#2A3A34';
    ctx.fillRect(gx - barW - 2, h-padB-budgetH, barW, budgetH);
    ctx.fillStyle = it.spent > it.amount ? '#F2715E' : '#46E0A0';
    ctx.fillRect(gx + 2, h-padB-spentH, barW, spentH);
    ctx.fillStyle = '#8CA197';
    ctx.font = '10px IBM Plex Sans Arabic, sans-serif';
    ctx.textAlign = 'center';
    const label = it.start.slice(5).replace('-','/');
    ctx.fillText(label, gx, h-4);
  });
}

      <div class="row"><span>اللي صرفته من الميزانية</span><span>${Math.round(info.pctSpent)}%</span></div>
      <div class="bar ${info.pctSpent>info.pctTime?'over':''}"><div style="width:${Math.min(100,info.pctSpent)}%"></div></div>
    </div>`;

  // --- آخر الحركات ---
  const allRows = state.expenses.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const rows = showExpenseList ? allRows : allRows.slice(0,5);
  const feedHtml = rows.length ? rows.map(e=>`
    <div class="row ${e.date<info.allocStart?'old':''}">
      <div class="rt"><div class="rn">${e.note?esc(e.note):'بدون ملاحظة'}</div><div class="rd">${dateLabel(e.date)}${e.date<info.allocStart?' · قبل بداية الحسبة':''}</div></div>
      <div class="ra">${fmt(e.amount)}</div>
      <button class="del" data-id="${e.id}">✕</button>
    </div>`).join('') : `<div class="empty">لسا ما سجلت صرف يومي، دوس + وابلش</div>`;
  const feedToggle = allRows.length>5 ? `<button id="toggleExpenseList">${showExpenseList?'عرض أقل':'عرض الكل ('+allRows.length+')'}</button>` : '';

  // --- تطور الحصة اليومية ---
  let trendHtml = '';
  const ser = info.allowSeries;
  if(ser.length>=2 && !info.periodOver){
    const vals = ser.map(x=>x.v), mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn)||1;
    const pts = vals.map((v,i)=> (i/(vals.length-1)*300).toFixed(1)+','+(50-((v-mn)/rg)*40).toFixed(1)).join(' ');
    const first = vals[0], last = vals[vals.length-1];
    trendHtml = `<div class="sect"><span>تطور حصتك اليومية</span></div>
      <div class="card"><svg viewBox="0 0 300 60" style="width:100%;height:70px;display:block;" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${last<first-0.005?'#F2715E':'#46E0A0'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
      <div class="ring-f" style="margin-top:8px;">من <b>${fmt(first)}</b> إلى <b>${fmt(last)}</b> د.أ خلال ${ser.length} يوم</div></div>`;
  }

  // --- كروت الأسابيع ---
  let weeksHtml = '';
  if(isMonthly && info.weeksTable.length){
    weeksHtml = `<div class="sect"><span>الأسابيع</span></div><div class="weeks-scroll">` + info.weeksTable.map((w,i)=>{
      const cur = i===info.currentWeekIndex;
      const pct = (w.pending || w.budget<=0) ? 0 : Math.min(100,(w.spent/w.budget)*100);
      const overW = !w.pending && w.spent>w.budget+0.005;
      return `<div class="wk ${cur?'cur':''} ${w.pending?'pend':''}">
        <div class="wd"><bdi dir="ltr">${w.start.slice(5).replace('-','/')} → ${w.end.slice(5).replace('-','/')}</bdi>${cur?' · الحالي':''}</div>
        <div class="wb">${fmt(w.budget)}</div>
        <div class="bar"><div class="${overW?'over':''}" style="width:${pct}%"></div></div>
        <div class="ws">${w.pending?'لسا':('صرفت '+fmt(w.spent))}</div>
      </div>`;
    }).join('') + `</div>`;
  }

  // --- الالتزامات ---
  const otherSpent = (state.otherExpenses||[]).reduce((s,e)=>s+e.amount,0);
  const generalRemaining = (state.generalBudgetAmount||0) - otherSpent;
  const otherByRows = (state.otherExpenses||[]).slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const otherRowsHtml = otherByRows.length ? otherByRows.map(e=>`
    <div class="row">
      <div class="rt"><div class="rn">${e.note?esc(e.note):'بدون ملاحظة'}</div><div class="rd">${dateLabel(e.date)}</div></div>
      <div class="ra">${fmt(e.amount)}</div>
      <button class="delOther" data-id="${e.id}" style="background:none;border:none;color:#5d7469;font-size:15px;cursor:pointer;padding:4px 6px;">✕</button>
    </div>`).join('') : `<div class="empty">لسا ما سجلت التزامات</div>`;
  let otherBudgetHtml = '';
  if(state.generalBudgetAmount>0 || otherSpent>0){
    const bp = state.generalBudgetAmount>0 ? Math.min(100,(otherSpent/state.generalBudgetAmount)*100) : 100;
    otherBudgetHtml = `
      <div class="sect"><span>الالتزامات والفواتير</span></div>
      <div class="card">
        <div class="card-h"><h2>مصاريف أخرى <small>(ما بتأثر على الحصة اليومية)</small></h2><button class="linklike inl" id="toggleOtherList">${showOtherList?'إخفاء السجل':'السجل'}</button></div>
        <div class="bill-top"><div><div class="k">المتبقي</div><div class="v ${generalRemaining<0?'neg':''}">${fmt(generalRemaining)}</div></div><div class="k2">من ${fmt(state.generalBudgetAmount||0)} · صرفت ${fmt(otherSpent)}</div></div>
        <div class="bar"><div class="${generalRemaining<0?'over':''}" style="width:${bp}%"></div></div>
        ${showOtherList ? `<div style="margin-top:6px;">${otherRowsHtml}</div>` : ''}
      </div>`;
  }

  let historyHtml = '';
  if(state.history.length){
    historyHtml = `
      <div class="sect"><span>مقارنة الفترات السابقة</span></div>
      <div class="card">
        <canvas id="historyChart"></canvas>
        <div class="legend"><span><i style="background:#2A3A34"></i>الميزانية</span><span><i style="background:#46E0A0"></i>الصرف (ضمن الحد)</span><span><i style="background:#F2715E"></i>الصرف (تجاوز)</span></div>
      </div>`;
  }

  // --- نافذة الإضافة السريعة ---
  let sheetHtml = '';
  if(sheetOpen && !info.periodOver){
    const dateVal = info.notStarted ? info.allocStart : info.today;
    let body = '';
    if(sheetTab==='spend'){
      body = `
        <input type="number" inputmode="decimal" id="expAmount" class="amt-in" placeholder="0.00" min="0" step="0.01">
        <div class="chips">${[1,2,3,5,10].map(n=>`<button data-q="${n}" data-target="expAmount">${n}</button>`).join('')}</div>
        <div class="field"><input type="text" id="expNote" placeholder="على شو صرفت؟ (اختياري)"></div>
        <div class="chips">${['قهوة','أكل','مواصلات','بنزين','سوبرماركت'].map(n=>`<button data-note="${n}">${n}</button>`).join('')}</div>
        <div class="field"><label>التاريخ</label><input type="date" id="expDate" value="${dateVal}" min="${info.allocStart}" max="${info.periodEnd}"></div>
        <button class="primary" id="expAddBtn">سجّل الصرف</button>`;
    } else if(sheetTab==='daytotal'){
      body = `
        <p class="hint">لو عرفت قديش صرفت إجمالاً بيوم معين، حط المجموع هون. إذا في صرف مسجل قبل لنفس اليوم، بيحسب الفرق ويضيفه بس، بدون تكرار.</p>
        <div class="field"><label>التاريخ</label><input type="date" id="dayTotalDate" value="${dateVal}" min="${info.allocStart}" max="${info.periodEnd}"></div>
        <input type="number" inputmode="decimal" id="dayTotalAmount" class="amt-in" placeholder="مجموع اليوم" min="0" step="0.01">
        <div style="height:12px"></div>
        <button class="primary" id="dayTotalBtn">احسب وسجّل الفرق</button>`;
    } else {
      body = `
        <p class="hint">للفواتير والالتزامات. بتنخصم من ميزانية الالتزامات بس، وما بتأثر على حصتك اليومية.</p>
        <input type="number" inputmode="decimal" id="otherAmount" class="amt-in" placeholder="0.00" min="0" step="0.01">
        <div style="height:12px"></div>
        <div class="field"><input type="text" id="otherNote" placeholder="مثلاً: فاتورة كهرباء"></div>
        <button class="primary" id="otherAddBtn">سجّل الالتزام</button>`;
    }
    sheetHtml = `
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet">
        <div class="grab"></div>
        <div class="seg">
          <button data-tab="spend" class="${sheetTab==='spend'?'active':''}">صرف يومي</button>
          <button data-tab="daytotal" class="${sheetTab==='daytotal'?'active':''}">مجموع يوم</button>
          <button data-tab="bill" class="${sheetTab==='bill'?'active':''}">التزام</button>
        </div>
        ${body}
      </div>`;
  }

  const subtitle = (isMonthly?'شهرية':'أسبوعية') + ' · ' + fmt(state.budgetAmount) + ' د.أ · <bdi dir="ltr">' + info.allocStart.slice(5).replace('-','/') + ' → ' + info.periodEnd.slice(5).replace('-','/') + '</bdi>';

  app.innerHTML = `
    <div class="masthead"><h1>دفتر المصروف</h1><p>ميزانية ${subtitle}</p><div class="ver">${APP_VERSION}</div></div>
    ${savingsBanner}
    ${heroHtml}
    ${miniHtml}
    ${paceHtml}
    <div class="sect"><span>آخر الحركات</span>${feedToggle}</div>
    <div class="feed">${feedHtml}</div>
    ${trendHtml}
    ${weeksHtml}
    ${otherBudgetHtml}
    ${historyHtml}
    <div class="foot">
      <button id="resetBtn">بدء فترة جديدة</button>
      <button id="editBudgetBtn">تعديل الميزانية</button>
      <button id="exportBtn">نسخة احتياطية</button>
      <button id="importBtn">استرجاع</button>
      <button id="signOutBtn">تسجيل خروج</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    ${(!info.periodOver && !sheetOpen) ? '<button class="fab" id="fab" aria-label="تسجيل صرف">+</button>' : ''}
    ${sheetHtml}
  `;

  // --- أحداث ---
  const setSheet = (open, tab) => { sheetOpen = open; if(tab) sheetTab = tab; animate = false; render(); animate = true; };
  const fab = document.getElementById('fab');
  if(fab) fab.onclick = () => setSheet(true, 'spend');
  const bd = document.getElementById('sheetBackdrop');
  if(bd) bd.onclick = () => setSheet(false);
  document.querySelectorAll('[data-tab]').forEach(b=>{ b.onclick = () => setSheet(true, b.dataset.tab); });
  document.querySelectorAll('[data-q]').forEach(b=>{ b.onclick = () => { document.getElementById(b.dataset.target).value = b.dataset.q; }; });
  document.querySelectorAll('[data-note]').forEach(b=>{ b.onclick = () => { document.getElementById('expNote').value = b.dataset.note; }; });
  if(sheetOpen){
    const first = document.getElementById(sheetTab==='spend' ? 'expAmount' : (sheetTab==='daytotal' ? 'dayTotalAmount' : 'otherAmount'));
    if(first) setTimeout(()=>first.focus(), 60);
  }

  const addBtn = document.getElementById('expAddBtn');
  if(addBtn){
    addBtn.onclick = () => {
      const amt = parseFloat(document.getElementById('expAmount').value);
      const note = document.getElementById('expNote').value.trim();
      const date = document.getElementById('expDate').value || todayStr();
      if(!amt||amt<=0){ alert('لازم تدخل مبلغ صحيح'); return; }
      if(date < info.allocStart || date > info.periodEnd){ alert('التاريخ لازم يكون من بداية الحسبة (' + info.allocStart + ') لآخر الفترة'); return; }
      sheetOpen = false;
      addExpense(amt, note, date);
    };
  }
  const otherAddBtn = document.getElementById('otherAddBtn');
  if(otherAddBtn){
    otherAddBtn.onclick = () => {
      const amt = parseFloat(document.getElementById('otherAmount').value);
      const note = document.getElementById('otherNote').value.trim();
      if(!amt||amt<=0){ alert('لازم تدخل مبلغ صحيح'); return; }
      sheetOpen = false;
      addOtherExpense(amt, note, todayStr());
    };
  }
  const dayTotalBtn = document.getElementById('dayTotalBtn');
  if(dayTotalBtn){
    dayTotalBtn.onclick = () => {
      const date = document.getElementById('dayTotalDate').value || todayStr();
      const total = parseFloat(document.getElementById('dayTotalAmount').value);
      if(isNaN(total) || total < 0){ alert('لازم تدخل مبلغ صحيح'); return; }
      if(date < info.allocStart || date > info.periodEnd){ alert('التاريخ لازم يكون من بداية الحسبة (' + info.allocStart + ') لآخر الفترة'); return; }
      sheetOpen = false;
      logDayTotal(date, total);
    };
  }
  document.querySelectorAll('.del').forEach(btn=>{ btn.onclick=()=>deleteExpense(btn.dataset.id); });
  document.querySelectorAll('.delOther').forEach(btn=>{ btn.onclick=()=>deleteOtherExpense(btn.dataset.id); });
  const tel = document.getElementById('toggleExpenseList'); if(tel) tel.onclick = () => { showExpenseList = !showExpenseList; animate=false; render(); animate=true; };
  const tol = document.getElementById('toggleOtherList'); if(tol) tol.onclick = () => { showOtherList = !showOtherList; animate=false; render(); animate=true; };
  const rb2 = document.getElementById('resetBtn2'); if(rb2) rb2.onclick = startNewPeriodFlow;
  document.getElementById('resetBtn').onclick = startNewPeriodFlow;
  document.getElementById('editBudgetBtn').onclick = ()=>{ ui={mode:'editBudget'}; render(); };
  document.getElementById('exportBtn').onclick = exportBackup;
  document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = (e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); };
  document.getElementById('signOutBtn').onclick = signOut;

  // --- حركة الدائرة والرقم ---
  const arc = document.getElementById('ringArc');
  if(arc && animate){
    const tgt = arc.dataset.target;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ arc.style.strokeDasharray = tgt + ' ' + C; }));
  }
  const rv = document.getElementById('ringVal');
  if(rv && animate){
    const to = parseFloat(rv.dataset.v)||0; const t0 = performance.now();
    const step = (t)=>{ const k = Math.min(1,(t-t0)/700); const e = 1-Math.pow(1-k,3); rv.textContent = fmt(to*e); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  const chartCanvas = document.getElementById('historyChart');
  if(chartCanvas) drawHistoryChart(chartCanvas, state.history);
}

initAuth();
</script>
</body>
</html>
